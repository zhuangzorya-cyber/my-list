<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="我的清单">
<meta name="theme-color" content="#ffffff">
<title>我的清单</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<style>
  :root {
    --bg: #f7f7f5;
    --card: #ffffff;
    --text: #1a1a1a;
    --text-sub: #8a8a8a;
    --accent: #2d7d6a;
    --accent-soft: #e8f3f0;
    --divider: #ececea;
    --tag-read: #2d7d6a;
    --tag-todo: #c4792b;
    --tag-watch: #5a6bbf;
    --tag-inbox: #9a9a9a;
    --tag-prompt: #8b5cb5;
    --tag-trash: #c44a4a;
    --header-bg: rgba(247,247,245,0.92);
    --btn-bg: #ffffff;
    --input-border: #ececea;
    --modal-bg: #ffffff;
    --shadow: rgba(0,0,0,0.04);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #141416;
      --card: #1e1e22;
      --text: #ececec;
      --text-sub: #888;
      --accent: #4cb39a;
      --accent-soft: #1f3530;
      --divider: #2a2a2e;
      --tag-read: #4cb39a;
      --tag-todo: #d49550;
      --tag-watch: #7d8fd6;
      --tag-inbox: #aaa;
      --tag-prompt: #b589d6;
      --tag-trash: #e07070;
      --header-bg: rgba(20,20,22,0.92);
      --btn-bg: #2a2a2e;
      --input-border: #2a2a2e;
      --modal-bg: #1e1e22;
      --shadow: rgba(0,0,0,0.3);
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; padding: 0; background: var(--bg);
    font-family: -apple-system, "PingFang SC", "Helvetica Neue", sans-serif;
    color: var(--text); font-size: 16px; line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    max-width: 720px; margin: 0 auto; min-height: 100vh;
  }
  header {
    position: sticky; top: 0; z-index: 10;
    background: var(--header-bg); backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    padding: 16px 18px 10px; border-bottom: 1px solid var(--divider);
  }
  header h1 { margin: 0; font-size: 22px; font-weight: 600; letter-spacing: -0.3px; display: flex; align-items: center; gap: 10px; }
  header .sub { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  main { padding: 14px 16px 100px; }
  .empty {
    text-align: center; padding: 60px 20px; color: var(--text-sub);
    font-size: 14px;
  }
  .empty .emoji { font-size: 36px; display: block; margin-bottom: 10px; opacity: 0.4; }
  .footer-hint {
    text-align: center; font-size: 11px; color: var(--text-sub);
    padding: 20px; margin-top: 10px;
  }

  /* ===== 首页 2×2 概览方块 ===== */
  .overview-grid {
    display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-top: 14px;
  }
  .overview-card {
    display: flex; flex-direction: column; align-items: flex-start; gap: 12px;
    background: var(--card); border-radius: 16px; padding: 20px 18px;
    border: 1px solid var(--divider); cursor: pointer;
    transition: transform 0.12s; position: relative; overflow: hidden;
  }
  .overview-card:active { transform: scale(0.97); }
  .ov-icon {
    width: 40px; height: 40px; border-radius: 11px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px;
  }
  .ov-title { font-size: 16px; font-weight: 600; color: var(--text); }
  .ov-count {
    font-size: 32px; font-weight: 700; color: var(--text);
    line-height: 1; font-variant-numeric: tabular--nums; margin-top: auto;
  }
  .ov-count.zero { color: var(--text-sub); opacity: 0.35; }
  .ov-icon-todo { background: #fdf0e3; }
  .ov-icon-read { background: var(--accent-soft); }
  .ov-icon-watch { background: #eceefc; }
  .ov-icon-prompt { background: #f3edf8; }
  @media (prefers-color-scheme: dark) {
    .ov-icon-todo { background: #3a2a18; }
    .ov-icon-watch { background: #23263a; }
    .ov-icon-prompt { background: #2e2438; }
  }

  /* ===== 条目卡片（左滑删除） ===== */
  .swipe-wrap {
    position: relative; margin-bottom: 8px; overflow: hidden;
    border-radius: 12px;
  }
  .swipe-actions {
    position: absolute; top: 0; right: 0; bottom: 0;
    display: flex; align-items: stretch;
    transform: translateX(100%); transition: transform 0.25s ease;
  }
  .swipe-wrap.open .swipe-actions { transform: translateX(0); }
  .swipe-actions .swipe-del {
    display: flex; align-items: center; justify-content: center;
    background: var(--tag-trash); color: #fff; font-size: 14px; font-weight: 500;
    width: 80px; cursor: pointer; border: none; font-family: inherit;
  }
  .swipe-content {
    transition: transform 0.25s ease; will-change: transform;
    background: var(--card); border-radius: 12px;
    border: 1px solid var(--divider);
  }
  .swipe-wrap.open .swipe-content { transform: translateX(-80px); }
  .swipe-content:active { /* scale handled by JS */ }
  .item {
    background: var(--card); border-radius: 12px; padding: 14px 16px;
    border: 1px solid var(--divider);
  }
  .item-head { display: flex; align-items: flex-start; gap: 10px; }
  .item-title { font-size: 16px; font-weight: 600; flex: 1; line-height: 1.35; }
  .item-author { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
  .item-summary { font-size: 13px; color: var(--text-sub); margin-top: 8px; line-height: 1.5; }
  .item-meta {
    display: flex; align-items: center; gap: 10px; margin-top: 10px;
    font-size: 11px; color: var(--text-sub);
  }
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 4px;
    font-size: 11px; font-weight: 500;
  }
  .badge-todo { background: #fdf0e3; color: var(--tag-todo); }
  .badge-read { background: var(--accent-soft); color: var(--tag-read); }
  .badge-watch { background: #eceefc; color: var(--tag-watch); }
  .badge-prompt { background: #f3edf8; color: var(--tag-prompt); }
  .badge-trash { background: #fce8e8; color: var(--tag-trash); }
  @media (prefers-color-scheme: dark) {
    .badge-todo { background: #3a2a18; }
    .badge-watch { background: #23263a; }
    .badge-prompt { background: #2e2438; }
    .badge-trash { background: #3a1a1a; }
  }
  .due { color: var(--tag-todo); font-weight: 500; }
  .actions { display: flex; gap: 6px; margin-top: 10px; }
  .btn {
    flex: 1; padding: 7px 10px; border-radius: 8px; font-size: 12px;
    border: 1px solid var(--divider); background: var(--btn-bg); color: var(--text);
    cursor: pointer; font-family: inherit;
  }
  .btn:active { background: var(--divider); }
  .done .item-title { text-decoration: line-through; color: var(--text-sub); }
  .done .item-summary { opacity: 0.5; }

  /* ===== 打勾按钮 ===== */
  .check-btn {
    flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
    border: 2px solid var(--text-sub); background: transparent;
    cursor: pointer; display: flex; align-items: center; justify-content: center;
    transition: all 0.2s; font-family: inherit; padding: 0; margin-top: 2px;
  }
  .check-btn svg { width: 16px; height: 16px; opacity: 0; transition: opacity 0.2s; }
  .done .check-btn { background: var(--accent); border-color: var(--accent); }
  .done .check-btn svg { opacity: 1; }

  /* ===== 标签（带颜色区分） ===== */
  .item-tags { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 8px; }
  .tag {
    display: inline-block; padding: 2px 8px; border-radius: 999px;
    font-size: 11px; border: 1px solid transparent;
  }
  .tag-clickable { cursor: pointer; }
  /* 各分组颜色 */
  .tag-gender { background: #fde8ef; color: #b83a6b; border-color: #f5d0dd; }
  .tag-theme { background: #e8f0fd; color: #2c5fa8; border-color: #d0def5; }
  .tag-vibe { background: #f0ede8; color: #7a5a3a; border-color: #e5dfd5; }
  .tag-region { background: #e8f5ed; color: #2a7a4a; border-color: #d0e8d8; }
  .tag-type { background: #f3edf8; color: #7b4ca0; border-color: #e5d5f0; }
  .tag-custom { background: var(--divider); color: var(--text-sub); border-color: var(--divider); }
  @media (prefers-color-scheme: dark) {
    .tag-gender { background: #3a1a28; color: #e070a0; border-color: #4a2233; }
    .tag-theme { background: #1a2840; color: #7da5e0; border-color: #243555; }
    .tag-vibe { background: #2a2620; color: #c9a878; border-color: #3a3530; }
    .tag-region { background: #1a3028; color: #6abf8a; border-color: #244035; }
    .tag-type { background: #2e2438; color: #b589d6; border-color: #3a2e48; }
  }

  /* ===== 标签编辑弹窗 ===== */
  .modal-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 100;
    display: none; align-items: flex-end; justify-content: center;
  }
  .modal-mask.show { display: flex; }
  .modal {
    background: var(--modal-bg); width: 100%; max-width: 720px; border-radius: 16px 16px 0 0;
    padding: 18px 18px 30px; max-height: 80vh; overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .modal h3 { margin: 0 0 4px; font-size: 17px; }
  .modal .modal-sub { font-size: 12px; color: var(--text-sub); margin-bottom: 14px; }
  .modal .tag-group { margin-bottom: 14px; }
  .modal .tag-group-title { font-size: 12px; color: var(--text-sub); margin-bottom: 6px; font-weight: 500; }
  .modal .tag-options { display: flex; flex-wrap: wrap; gap: 6px; }
  .modal .tag-opt {
    padding: 5px 12px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--divider); background: var(--btn-bg); color: var(--text);
    cursor: pointer;
  }
  .modal .tag-opt.selected { font-weight: 600; }
  .modal .custom-input { display: flex; gap: 6px; margin-top: 6px; }
  .modal .custom-input input {
    flex: 1; padding: 8px 12px; border-radius: 8px; border: 1px solid var(--input-border);
    font-size: 14px; font-family: inherit; background: var(--modal-bg); color: var(--text);
  }
  .modal .custom-input button {
    padding: 8px 14px; border-radius: 8px; background: var(--text); color: var(--btn-bg);
    border: none; font-size: 13px; font-family: inherit; cursor: pointer;
  }
  .modal .modal-actions { display: flex; gap: 8px; margin-top: 18px; }
  .modal .modal-actions button {
    flex: 1; padding: 10px; border-radius: 10px; font-size: 14px;
    border: 1px solid var(--divider); background: var(--btn-bg); color: var(--text); cursor: pointer; font-family: inherit;
  }
  .modal .modal-actions .primary { background: var(--accent); color: #fff; border-color: var(--accent); }

  /* ===== 侧边抽屉 ===== */
  .drawer-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,0.4); z-index: 90;
    display: none; opacity: 0; transition: opacity 0.25s;
  }
  .drawer-mask.show { display: block; opacity: 1; }
  .drawer {
    position: fixed; top: 0; left: 0; bottom: 0; width: 260px; max-width: 80vw;
    background: var(--modal-bg); z-index: 91;
    transform: translateX(-100%); transition: transform 0.25s ease;
    padding: 20px 0 30px; overflow-y: auto; -webkit-overflow-scrolling: touch;
    box-shadow: 2px 0 12px rgba(0,0,0,0.1);
  }
  .drawer.show { transform: translateX(0); }
  .drawer-header { padding: 8px 18px 18px; border-bottom: 1px solid var(--divider); }
  .drawer-header h2 { margin: 0; font-size: 18px; }
  .drawer-header .sub { font-size: 12px; color: var(--text-sub); margin-top: 4px; }
  .drawer-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 13px 18px; cursor: pointer; font-size: 15px; color: var(--text);
    border-left: 3px solid transparent;
  }
  .drawer-item:active { background: var(--divider); }
  .drawer-item.active { background: var(--accent-soft); border-left-color: var(--accent); color: var(--accent); font-weight: 500; }
  .drawer-item .count { font-size: 12px; color: var(--text-sub); }
  .drawer-item.active .count { color: var(--accent); }
  .drawer-divider { height: 1px; background: var(--divider); margin: 8px 0; }
  .menu-btn {
    background: transparent; border: none; padding: 4px 8px; cursor: pointer;
    color: var(--text); font-size: 20px; line-height: 1; font-family: inherit;
  }

  /* ===== 提示词卡片专用 ===== */
  .prompt-body {
    margin-top: 8px; padding: 10px 12px; background: var(--divider); border-radius: 8px;
    font-size: 13px; color: var(--text); line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    max-height: 120px; overflow: hidden; position: relative;
  }
  .prompt-body.expanded { max-height: none; }
  .prompt-body::after {
    content: ""; position: absolute; bottom: 0; left: 0; right: 0; height: 36px;
    background: linear-gradient(transparent, var(--divider));
  }
  .prompt-body.expanded::after { display: none; }
  .prompt-toggle { font-size: 12px; color: var(--accent); margin-top: 6px; cursor: pointer; }

  /* ===== 返回按钮（子分类视图） ===== */
  .back-btn {
    display: inline-flex; align-items: center; gap: 4px;
    background: transparent; border: none; color: var(--accent);
    font-size: 14px; font-family: inherit; cursor: pointer; padding: 4px 0;
    margin-bottom: 10px;
  }

  /* ===== 已完成折叠区 ===== */
  .done-section {
    margin-top: 16px; padding-top: 12px; border-top: 1px dashed var(--divider);
  }
  .done-section-title {
    font-size: 12px; color: var(--text-sub); font-weight: 500; margin-bottom: 8px;
  }
</style>
</head>
<body>

<header>
  <h1>
    <button class="menu-btn" id="menu-btn">≡</button>
    <span id="page-title">我的清单</span>
  </h1>
  <div class="sub" id="page-sub">把内容发给 WorkBuddy，自动归入这里</div>
</header>

<!-- 侧边抽屉 -->
<div class="drawer-mask" id="drawer-mask"></div>
<nav class="drawer" id="drawer">
  <div class="drawer-header">
    <h2>我的清单</h2>
    <div class="sub">按分类浏览</div>
  </div>
  <div class="drawer-item active" data-cat="all">
    <span>📊 全部</span><span class="count" id="c-all">0</span>
  </div>
  <div class="drawer-item" data-cat="todo">
    <span>⏰ 待办</span><span class="count" id="c-todo">0</span>
  </div>
  <div class="drawer-item" data-cat="read">
    <span>📚 待读</span><span class="count" id="c-read">0</span>
  </div>
  <div class="drawer-item" data-cat="watch">
    <span>🎬 想看</span><span class="count" id="c-watch">0</span>
  </div>
  <div class="drawer-item" data-cat="prompt">
    <span>🤖 提示词</span><span class="count" id="c-prompt">0</span>
  </div>
  <div class="drawer-divider"></div>
  <div class="drawer-item" data-cat="inbox">
    <span>📥 收件箱</span><span class="count" id="c-inbox">0</span>
  </div>
  <div class="drawer-item" data-cat="trash">
    <span>🗑 回收站</span><span class="count" id="c-trash">0</span>
  </div>
</nav>

<main id="list"></main>
<div class="footer-hint">加到桌面：Safari 分享 → 添加到主屏幕</div>

<!-- 标签编辑弹窗 -->
<div class="modal-mask" id="tag-modal">
  <div class="modal">
    <h3 id="modal-title">编辑标签</h3>
    <div class="modal-sub">可多选，也可自定义添加</div>
    <div id="modal-tag-groups"></div>
    <div class="tag-group">
      <div class="tag-group-title">自定义标签</div>
      <div class="custom-input">
        <input type="text" id="custom-tag-input" placeholder="输入标签名，回车添加">
        <button onclick="addCustomTag()">添加</button>
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="closeTagModal()">取消</button>
      <button class="primary" onclick="saveTags()">保存</button>
    </div>
  </div>
</div>

<script>
// ===== 数据 =====
let ITEMS = [
  {
    id: 1, cat: "read", title: "《思考，快与慢》", author: "丹尼尔·卡尼曼",
    summary: "讲人类思维的两套系统——系统1快速直觉，系统2慢速理性。探讨认知偏误与决策。",
    tags: [], added: "2026-10-07", done: false, deleted: false
  },
  {
    id: 2, cat: "todo", title: "AI创新大会注册", author: "",
    summary: "第七届AI应用创新大会，含大模型落地、Agent实践等议题。",
    due: "2026-10-20 截止", tags: [], added: "2026-10-07", done: false, deleted: false
  },
  {
    id: 3, cat: "watch", title: "《只此青绿》", author: "舞蹈诗剧",
    summary: "以《千里江山图》为灵感的舞蹈诗剧，舞美极有东方韵味。",
    tags: ["纪录片"], added: "2026-10-07", done: false, deleted: false
  },
  {
    id: 4, cat: "read", title: "《金牌打手》", author: "",
    extra: "看完后没再看过同类型小说",
    tags: ["BL","强强"], added: "2026-10-07", done: false, deleted: false
  },
  {
    id: 5, cat: "read", title: "《小阵雨》", author: "天然呆呀",
    extra: "排雷：受有听力障碍，不想听的话会直接摘助听器",
    tags: ["BL","甜文","治愈"], added: "2026-10-07", done: false, deleted: false
  },
  {
    id: 6, cat: "prompt", title: "写作润色提示词", author: "",
    prompt: "你是一位资深文字编辑。请对以下文本进行润色：\n1. 修正语法错误与不通顺之处\n2. 提升表达力，但保持原意\n3. 风格保持自然，不要过度华丽\n4. 输出润色后的文本，并在末尾用一句话说明主要改动\n\n原文：[在此粘贴]",
    tags: ["写作","润色"], added: "2026-10-07", done: false, deleted: false
  }
];

// ===== 标签库（按分组，每组有颜色类名） =====
const TAG_GROUPS = [
  { name: "性别向", cls: "tag-gender", tags: ["BL","BG","GL","无CP"] },
  { name: "题材",   cls: "tag-theme",  tags: ["先婚后爱","破镜重圆","娱乐圈","ABO","双性","重生","穿越","星际","末世","古言","现言","悬疑"] },
  { name: "氛围",   cls: "tag-vibe",  tags: ["甜文","虐文","沙雕","正剧","治愈","高甜","强强","年上","年下"] },
  { name: "地区",   cls: "tag-region", tags: ["韩剧","日剧","美剧","英剧","国产","中港台","其他"] },
  { name: "类型",   cls: "tag-type",   tags: ["纪录片","综艺","影视剧","动漫","电影","话剧","展览","演出"] },
  { name: "用途",   cls: "tag-type",   tags: ["写作","润色","代码","分析","翻译","总结","角色扮演"] }
];

// 标签 → 颜色类名 映射（快速查找）
const TAG_CLS_MAP = {};
TAG_GROUPS.forEach(g => g.tags.forEach(t => TAG_CLS_MAP[t] = g.cls));

function tagCls(t) { return TAG_CLS_MAP[t] || "tag-custom"; }

const DATA_VERSION = 8;

let currentCat = "all";
let editingId = null;
let editingTags = [];

const CAT_LABEL = { read:"待读", todo:"待办", watch:"想看", inbox:"收件箱", prompt:"提示词", trash:"回收站" };
const CAT_BADGE = { read:"badge-read", todo:"badge-todo", watch:"badge-watch", inbox:"badge-read", prompt:"badge-prompt", trash:"badge-trash" };
const CAT_ORDER = ["todo","read","watch","prompt","inbox","trash"];

// ===== 主渲染 =====
function render() {
  const list = document.getElementById("list");
  const pageTitle = document.getElementById("page-title");
  const pageSub = document.getElementById("page-sub");

  // 计数（排除已删除）
  const active = ITEMS.filter(i => !i.deleted);
  document.getElementById("c-all").textContent = active.length;
  CAT_ORDER.forEach(c => {
    const el = document.getElementById("c-"+c);
    if (el) {
      if (c === "trash") {
        el.textContent = ITEMS.filter(i=>i.deleted).length;
      } else {
        el.textContent = active.filter(i=>i.cat===c).length;
      }
    }
  });

  // 概览首页：2×2 方块
  if (currentCat === "all") {
    pageTitle.textContent = "我的清单";
    pageSub.textContent = "把内容发给 WorkBuddy，自动归入这里";
    const cats = [
      { key:"todo",   icon:"⏰", label:"待办",   iconCls:"ov-icon-todo" },
      { key:"read",   icon:"📚", label:"待读",   iconCls:"ov-icon-read" },
      { key:"watch",  icon:"🎬", label:"想看",   iconCls:"ov-icon-watch" },
      { key:"prompt", icon:"🤖", label:"提示词", iconCls:"ov-icon-prompt" }
    ];
    let html = '<div class="overview-grid">';
    cats.forEach(c => {
      const n = active.filter(i=>i.cat===c.key).length;
      html += `
        <div class="overview-card" onclick="selectCat('${c.key}')">
          <div class="ov-icon ${c.iconCls}">${c.icon}</div>
          <div class="ov-title">${c.label}</div>
          <div class="ov-count ${n===0?'zero':''}">${n}</div>
        </div>`;
    });
    html += '</div>';
    list.innerHTML = html;
    return;
  }

  // 单分类视图
  pageTitle.textContent = CAT_LABEL[currentCat];
  pageSub.textContent = "";

  let items;
  if (currentCat === "trash") {
    items = ITEMS.filter(i => i.deleted);
  } else {
    items = active.filter(i => i.cat === currentCat);
  }

  if (items.length === 0) {
    const msg = currentCat === "trash" ? "回收站是空的" : "这里还空着<br>把内容发给 WorkBuddy，它会自动整理后塞进来";
    list.innerHTML = `<div class="empty"><span class="emoji">${currentCat==='trash'?'🗑':'📝'}</span>${msg}</div>`;
    return;
  }

  // 完成的往下沉
  const undone = items.filter(i => !i.done);
  const done = items.filter(i => i.done);

  let html = "";
  // 返回按钮
  html += `<button class="back-btn" onclick="selectCat('all')">‹ 返回首页</button>`;

  if (undone.length > 0) {
    html += undone.map(renderItem).join("");
  }
  if (done.length > 0) {
    html += `<div class="done-section"><div class="done-section-title">已完成 (${done.length})</div>`;
    html += done.map(renderItem).join("");
    html += `</div>`;
  }
  list.innerHTML = html;
}

function selectCat(cat) {
  currentCat = cat;
  document.querySelectorAll(".drawer-item").forEach(x=>x.classList.remove("active"));
  const item = document.querySelector(`.drawer-item[data-cat="${cat}"]`);
  if (item) item.classList.add("active");
  render();
  closeDrawer();
}

function renderItem(i) {
  const dueLine = i.due ? `<span class="due">⏰ ${i.due}</span>` : "";
  const authorLine = i.author ? `<div class="item-author">${i.author}</div>` : "";
  const tagsLine = (i.tags && i.tags.length) ? `<div class="item-tags">${i.tags.map(t=>`<span class="tag ${tagCls(t)}">${t}</span>`).join("")}</div>` : "";
  const extraLine = i.extra ? `<div class="item-summary" style="border-left:2px solid var(--divider);padding-left:8px;margin-top:6px">${i.extra}</div>` : "";
  const promptBlock = i.prompt ? `
    <div class="prompt-body" id="pb-${i.id}">${i.prompt.replace(/</g,"&lt;")}</div>
    <div class="prompt-toggle" onclick="togglePrompt(${i.id})">展开全文</div>
  ` : "";
  const copyBtn = i.prompt ? `<button class="btn" onclick="copyPrompt(${i.id})">📋 复制</button>` : "";

  // 回收站里显示恢复+彻底删除（底部按钮）；其他分类显示打勾+标签+收件箱（底部按钮），删除走左滑
  let actionsHtml = "";
  if (i.deleted) {
    actionsHtml = `
      <div class="actions">
        <button class="btn btn-primary" onclick="restoreItem(${i.id})">↩ 恢复</button>
        <button class="btn" onclick="hardDel(${i.id})">彻底删除</button>
      </div>`;
  } else {
    actionsHtml = `
      <div class="actions">
        <button class="btn" onclick="openTagModal(${i.id})">🏷 标签</button>
        ${copyBtn}
        <button class="btn" onclick="moveTo(${i.id},'inbox')">→收件箱</button>
      </div>`;
  }

  // 打勾按钮（回收站不显示）
  const checkBtn = i.deleted ? "" : `<button class="check-btn" onclick="toggleDone(${i.id})"><svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg></button>`;

  // 左滑删除按钮（回收站不显示，已有彻底删除按钮）
  const swipeDelBtn = i.deleted ? "" : `<div class="swipe-actions"><button class="swipe-del" onclick="del(${i.id})">删除</button></div>`;

  return `
    <div class="swipe-wrap" data-id="${i.id}">
      ${swipeDelBtn}
      <div class="swipe-content">
        <div class="item ${i.done?'done':''}">
          <div class="item-head">
            ${checkBtn}
            <div style="flex:1">
              <div class="item-title">${i.title}</div>
              ${authorLine}
            </div>
            ${i.deleted ? '<span class="badge badge-trash">已删除</span>' : (currentCat==='all' ? `<span class="badge ${CAT_BADGE[i.cat]}">${CAT_LABEL[i.cat]}</span>` : '')}
          </div>
          ${i.summary ? `<div class="item-summary">${i.summary}</div>` : ""}
          ${extraLine}
          ${promptBlock}
          ${tagsLine}
          <div class="item-meta">
            ${dueLine}
            <span>+${i.added}</span>
          </div>
          ${actionsHtml}
        </div>
      </div>
    </div>
  `;
}

function toggleDone(id) {
  const i = ITEMS.find(x=>x.id===id); if(i) i.done=!i.done; save(); render();
}
function del(id) {
  const i = ITEMS.find(x=>x.id===id);
  if(i) i.deleted = true;
  save(); render();
}
function hardDel(id) {
  if(!confirm("彻底删除后无法恢复，确定？")) return;
  ITEMS = ITEMS.filter(x=>x.id!==id); save(); render();
}
function restoreItem(id) {
  const i = ITEMS.find(x=>x.id===id);
  if(i) i.deleted = false;
  save(); render();
}
function moveTo(id, cat) {
  const i = ITEMS.find(x=>x.id===id); if(i){ i.cat=cat; } save(); render();
}

// ===== 左滑删除（touch 交互） =====
const SWIPE_THRESHOLD = 40;      // 滑过这个距离才打开
const SWIPE_OPEN_OFFSET = -80;    // 打开时内容左移 80px
let activeSwipe = null;          // 当前打开的 swipe-wrap
let closeTimer = null;

function closeAllSwipes(except) {
  document.querySelectorAll(".swipe-wrap.open").forEach(el => {
    if (el !== except) el.classList.remove("open");
  });
}

document.addEventListener("touchstart", e => {
  const wrap = e.target.closest(".swipe-wrap");
  if (!wrap) {
    // 点到空白处，关闭所有打开的
    if (activeSwipe && !e.target.closest(".swipe-actions")) {
      closeAllSwipes();
      activeSwipe = null;
    }
    return;
  }
  // 如果有别的打开着，先关掉
  if (activeSwipe && activeSwipe !== wrap) {
    closeAllSwipes(wrap);
    activeSwipe = wrap;
    // 阻止这次 touch 继续触发，等下一次手势
    return;
  }
  wrap._startX = e.touches[0].clientX;
  wrap._startY = e.touches[0].clientY;
  wrap._moved = false;
}, { passive: true });

document.addEventListener("touchmove", e => {
  if (!e.target.closest) return;
  const wrap = e.target.closest(".swipe-wrap");
  if (!wrap || wrap._startX == null) return;
  const dx = e.touches[0].clientX - wrap._startX;
  const dy = e.touches[0].clientY - wrap._startY;
  // 横向滑动幅度大于纵向才视为左滑
  if (Math.abs(dx) < 10 || Math.abs(dx) < Math.abs(dy)) return;
  wrap._moved = true;
  const content = wrap.querySelector(".swipe-content");
  let offset = wrap.classList.contains("open") ? SWIPE_OPEN_OFFSET + dx : dx;
  if (offset > 0) offset = 0;
  if (offset < SWIPE_OPEN_OFFSET) offset = SWIPE_OPEN_OFFSET;
  content.style.transform = `translateX(${offset}px)`;
  content.style.transition = "none";
}, { passive: true });

document.addEventListener("touchend", e => {
  const wrap = e.target.closest ? e.target.closest(".swipe-wrap") : null;
  if (!wrap || wrap._startX == null) return;
  const dx = (e.changedTouches[0].clientX || 0) - wrap._startX;
  const content = wrap.querySelector(".swipe-content");
  content.style.transition = "";
  content.style.transform = "";
  if (!wrap._moved) {
    // 没滑动过，如果是已打开状态则关闭
    if (wrap.classList.contains("open")) {
      wrap.classList.remove("open");
      activeSwipe = null;
    }
    wrap._startX = null;
    return;
  }
  if (dx < -SWIPE_THRESHOLD) {
    wrap.classList.add("open");
    activeSwipe = wrap;
  } else if (dx > SWIPE_THRESHOLD) {
    wrap.classList.remove("open");
    if (activeSwipe === wrap) activeSwipe = null;
  } else {
    // 没过阈值，保持原状
    if (wrap.classList.contains("open")) {
      // 保持打开
    }
  }
  wrap._startX = null;
}, { passive: true });

// ===== 标签编辑弹窗 =====
// 每个分类只显示相关的标签组（按组名匹配）
const CAT_TAG_GROUPS = {
  read:   ["性别向","题材","氛围"],          // 待读：小说/书籍标签
  watch:  ["地区","类型"],                    // 想看：影视/演出标签
  prompt: ["用途"],                           // 提示词：用途标签
  todo:   [],                                 // 待办：没有预设标签
  inbox:  [],                                 // 收件箱：无预设
  trash:  []                                  // 回收站：无预设
};

function openTagModal(id) {
  const i = ITEMS.find(x=>x.id===id);
  if (!i) return;
  editingId = id;
  editingTags = [...(i.tags || [])];
  document.getElementById("modal-title").textContent = "编辑标签 · " + i.title;
  renderModalTags(i.cat);
  document.getElementById("tag-modal").classList.add("show");
}
function closeTagModal() {
  document.getElementById("tag-modal").classList.remove("show");
  editingId = null; editingTags = [];
}
function renderModalTags(cat) {
  const container = document.getElementById("modal-tag-groups");
  // 根据分类过滤要显示的标签组
  const allowedGroups = CAT_TAG_GROUPS[cat] || [];
  const groups = TAG_GROUPS.filter(g => allowedGroups.includes(g.name));
  let html = "";
  if (groups.length === 0) {
    html = `<div class="modal-sub" style="margin-bottom:10px">该分类没有预设标签，可直接在下方自定义添加</div>`;
  } else {
    groups.forEach(g => {
      html += `<div class="tag-group"><div class="tag-group-title">${g.name}</div><div class="tag-options">`;
      g.tags.forEach(t => {
        const selCls = editingTags.includes(t) ? "selected" : "";
        const colorCls = editingTags.includes(t) ? tagCls(t) : "";
        html += `<span class="tag-opt ${selCls} ${colorCls}" onclick="toggleEditTag('${t.replace(/'/g,"\\'")}')">${t}</span>`;
      });
      html += `</div></div>`;
    });
  }
  // 已有但不在预设列表里的标签（含自定义）始终显示
  const builtin = new Set(groups.flatMap(g=>g.tags));
  const customs = editingTags.filter(t => !builtin.has(t));
  if (customs.length) {
    html += `<div class="tag-group"><div class="tag-group-title">已添加（自定义）</div><div class="tag-options">`;
    customs.forEach(t => {
      html += `<span class="tag-opt selected tag-custom" onclick="toggleEditTag('${t.replace(/'/g,"\\'")}')">${t} ✕</span>`;
    });
    html += `</div></div>`;
  }
  container.innerHTML = html;
}
function toggleEditTag(t) {
  const idx = editingTags.indexOf(t);
  if (idx >= 0) editingTags.splice(idx, 1);
  else editingTags.push(t);
  renderModalTags();
}
function addCustomTag() {
  const input = document.getElementById("custom-tag-input");
  const v = input.value.trim();
  if (!v) return;
  if (!editingTags.includes(v)) editingTags.push(v);
  input.value = "";
  renderModalTags();
}
function saveTags() {
  const i = ITEMS.find(x=>x.id===editingId);
  if (i) i.tags = [...editingTags];
  save(); render(); closeTagModal();
}

// ===== 提示词展开/复制 =====
function togglePrompt(id) {
  const el = document.getElementById("pb-"+id);
  if (!el) return;
  el.classList.toggle("expanded");
  const toggle = el.nextElementSibling;
  if (toggle) toggle.textContent = el.classList.contains("expanded") ? "收起" : "展开全文";
}
function copyPrompt(id) {
  const i = ITEMS.find(x=>x.id===id);
  if (!i || !i.prompt) return;
  navigator.clipboard.writeText(i.prompt).then(() => {
    alert("已复制到剪贴板");
  }).catch(() => {
    const ta = document.createElement("textarea");
    ta.value = i.prompt; document.body.appendChild(ta);
    ta.select(); document.execCommand("copy"); document.body.removeChild(ta);
    alert("已复制到剪贴板");
  });
}

// ===== 持久化 =====
function save() {
  try {
    localStorage.setItem("myListItems", JSON.stringify(ITEMS));
    localStorage.setItem("myListVersion", DATA_VERSION);
  } catch(e){}
}
function load() {
  try {
    const v = parseInt(localStorage.getItem("myListVersion") || "0", 10);
    const s = localStorage.getItem("myListItems");
    if (s && v === DATA_VERSION) {
      ITEMS = JSON.parse(s);
    } else {
      save();
    }
  } catch(e){}
}

// ===== 侧边抽屉 =====
const drawer = document.getElementById("drawer");
const drawerMask = document.getElementById("drawer-mask");
function openDrawer() {
  drawer.classList.add("show");
  drawerMask.classList.add("show");
}
function closeDrawer() {
  drawer.classList.remove("show");
  drawerMask.classList.remove("show");
}
document.getElementById("menu-btn").addEventListener("click", openDrawer);
drawerMask.addEventListener("click", closeDrawer);

document.getElementById("drawer").addEventListener("click", e => {
  const item = e.target.closest(".drawer-item");
  if (!item) return;
  const cat = item.dataset.cat;
  if (!cat) return;
  selectCat(cat);
});

document.getElementById("custom-tag-input").addEventListener("keydown", e => {
  if (e.key === "Enter") { e.preventDefault(); addCustomTag(); }
});
document.getElementById("tag-modal").addEventListener("click", e => {
  if (e.target.id === "tag-modal") closeTagModal();
});

load();
render();
</script>
